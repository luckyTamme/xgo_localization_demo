name: images

# Publishes the two demo images to GHCR.
#
#   :latest / :vX.Y.Z         core   — amd64 + arm64, replay anywhere
#   :robot  / :vX.Y.Z-robot   robot  — arm64 only, drivers and camera
#
# Both arches build on native runners, so the slow Raspberry Pi libcamera
# compile never runs under emulation.

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image name
        # GHCR rejects uppercase repository names and the owner login may
        # contain them, so normalise rather than hardcoding one account.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/xgo-localization-demo" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push core (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: core
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:core-${{ matrix.arch }}-${{ github.sha }}
          cache-from: type=gha,scope=core-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.arch }}

  core-manifest:
    needs: core
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Resolve image name
        # GHCR rejects uppercase repository names and the owner login may
        # contain them, so normalise rather than hardcoding one account.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/xgo-localization-demo" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble the multi-arch tag
        run: |
          TAGS="-t ${IMAGE}:latest"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS="$TAGS -t ${IMAGE}:${GITHUB_REF#refs/tags/}"
          fi
          docker buildx imagetools create $TAGS \
            "${IMAGE}:core-amd64-${GITHUB_SHA}" \
            "${IMAGE}:core-arm64-${GITHUB_SHA}"

  robot:
    # arm64 only: the Raspberry Pi libcamera build and the XGO drivers have no
    # amd64 equivalent, and nothing on a laptop needs them.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image name
        # GHCR rejects uppercase repository names and the owner login may
        # contain them, so normalise rather than hardcoding one account.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/xgo-localization-demo" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          TAGS="${IMAGE}:robot"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS="$TAGS,${IMAGE}:${GITHUB_REF#refs/tags/}-robot"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - name: Build and push robot (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: robot
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=robot
          cache-to: type=gha,mode=max,scope=robot
